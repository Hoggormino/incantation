mod_description=Voice-cast Iron's Spells 'n Spellbooks by saying spell names out loud. Fully standalone and fully offline: Incantation captures your microphone itself, so no voice-chat mod is required. Speech recognition (Vosk) runs locally and only spells you actually have equipped will fire, so background chatter doesn't misfire a fireball. No voice training, no extra keybind, no setup beyond unzipping a small model into the config folder. Imbued weapons and spellbooks both supported. Customisable themes, hands-free queue, near-miss alias suggestions, and a full configuration UI.
