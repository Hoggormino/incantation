mod_description=Voice-cast Iron's Spells 'n Spellbooks through Simple Voice Chat. Offline speech recognition (Vosk) with the grammar dynamically narrowed to the spells you actually have equipped, so background chatter doesn't misfire a fireball. No voice training, no extra keybind, no setup beyond unzipping a small model into the config folder. Imbued weapons and spellbooks both supported. Customisable themes, hands-free queue, near-miss alias suggestions, and a full configuration UI.
