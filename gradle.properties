org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# Shared across every target. Anything that differs per Minecraft version lives in
# versions/<node>/gradle.properties instead.
mod.id=voicespells
mod.name=Iron's Spells: Incantation
mod.license=MIT
mod.version=0.9.5
mod.group=com.niko.voicespells
mod.authors=Hoggormino
mod.description=Voice-cast Iron's Spells 'n Spellbooks through Simple Voice Chat. Offline speech recognition (Vosk), with casting restricted to the spells you actually have equipped so an unowned spell can't misfire. No voice training, no extra keybind, and the speech model installs itself on first launch. Imbued weapons and spellbooks both supported. Customisable themes, hands-free queue, near-miss alias suggestions, and a full configuration UI.

# Loader-independent library versions.
deps.vosk=0.3.45
deps.voicechat_api=2.5.31
