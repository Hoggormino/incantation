org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# Shared across every target. Anything that differs per Minecraft version lives in
# versions/<node>/gradle.properties instead.
mod.id=voicespells
mod.name=Iron's Spells: Incantation
mod.license=MIT
mod.version=0.10.5
mod.group=com.niko.voicespells
mod.authors=Hoggormino
mod.description=Voice-cast Iron's Spells 'n Spellbooks by saying spell names out loud. Standalone and offline: Incantation captures your microphone itself, so no voice-chat mod is required. Speech recognition (Vosk) runs locally, and only spells you actually have equipped will fire. No voice training, and the speech model installs itself on first launch. Imbued weapons and spellbooks both supported. Customisable themes, hands-free queue, near-miss alias suggestions, and a full configuration UI.

# Loader-independent library versions. No voicechat API any more — the microphone is captured
# directly through OpenAL (LWJGL), which Minecraft already ships.
deps.vosk=0.3.45
