org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

## Minecraft / Forge
minecraft_version=1.20.1
# Exactly 1.20.1. The old [1.20.1,1.21) range let the jar LOAD on 1.20.2-1.20.6,
# where it is compiled against the wrong Minecraft APIs and breaks.
minecraft_version_range=[1.20.1]
# 47.4.10 is the current *recommended* Forge build for 1.20.1 (47.4.22 is latest).
# See the note in the report about compiling against an older 47.x for modpack reach.
forge_version=47.4.10
# Forge 47.x only - 48+ targets Minecraft 1.20.2+. The old [47,) had no upper bound.
forge_version_range=[47,48)
loader_version_range=[47,)

## Mappings - 'official' keeps Mojang names, identical to the NeoForge workspace.
mapping_channel=official
mapping_version=1.20.1
# Only if you enable the parchment librarian plugin:
parchment_version=2023.09.03

## Dependencies
# Compile floor for the SVC API. Verify against the oldest SVC 1.20.1 build you want to support.
voicechat_api_version=2.5.31
vosk_version=0.3.45
# Dev-runtime only (all reflective at compile time):
irons_spells_version=1.20.1-3.16.2
curios_version=5.14.1+1.20.1

## Mod metadata (unchanged from 1.21.1)
mod_id=voicespells
mod_name=Iron's Spells: Incantation
mod_license=MIT
mod_version=0.9.4
mod_group_id=com.niko.voicespells
mod_authors=Hoggormino
mod_description=Voice-cast Iron's Spells 'n Spellbooks through Simple Voice Chat. Offline speech recognition (Vosk) listens for the spell names your installed mods actually register, and only spells you have equipped will fire. No voice training, no extra keybind, no setup beyond unzipping a small model into the config folder. Imbued weapons and spellbooks both supported. Customisable themes, hands-free queue, near-miss alias suggestions, and a full configuration UI.
