org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.daemon=false

minecraft_version=1.21.1
# Exactly 1.21.1. The old [1.21.1,1.22) range let the jar LOAD on 1.21.2-1.21.11,
# where it is compiled against the wrong Minecraft APIs and breaks. It also made
# publishing tools tag the Modrinth page with eleven game versions.
minecraft_version_range=[1.21.1]
neo_version=21.1.219
# NeoForge 21.1.x only - 21.2+ targets Minecraft 1.21.2+. The old [21.1,) had no
# upper bound at all.
neo_version_range=[21.1,21.2)
loader_version_range=[4,)

voicechat_api_version=2.5.31

mod_id=voicespells
mod_name=Iron's Spells: Incantation
mod_license=MIT
mod_version=0.9.5
mod_group_id=com.niko.voicespells
mod_authors=Hoggormino
mod_description=Voice-cast Iron's Spells 'n Spellbooks through Simple Voice Chat. Offline speech recognition (Vosk), with casting restricted to the spells you actually have equipped so an unowned spell can't misfire. No voice training, no extra keybind, no setup beyond unzipping a small model into the config folder. Imbued weapons and spellbooks both supported. Customisable themes, hands-free queue, near-miss alias suggestions, and a full configuration UI.
