modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "icon.png"
logoBlur = false

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "irons_spellbooks"
# Optional: without Iron's Spells, SpellIndex finds zero spells via reflection and recognition
# just never matches. Mod loads without it.
type = "optional"
# Iron's Spells publishes "1.21.1-3.x.y", same prefix issue.
versionRange = "[1.21,)"
ordering = "AFTER"
side = "BOTH"
