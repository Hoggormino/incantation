pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		// Only needed if you enable the parchment librarian plugin in build.gradle:
		// maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'voicespells'
