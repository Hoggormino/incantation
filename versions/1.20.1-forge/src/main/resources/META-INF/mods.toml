modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "icon.png"
logoBlur = false
# The mod is not required on the client. A server running Incantation must accept players who
# do not have it — they just cannot voice-cast. Without this, the default MATCH_VERSION makes
# such a server show as incompatible in the multiplayer list even though the acceptMissingOr
# channel would let them connect. Keep this in step with Network.CHANNEL's acceptors.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "irons_spellbooks"
# Optional: without Iron's Spells, SpellIndex finds zero spells via reflection and recognition
# just never matches. Mod loads without it.
#
# The floor matters on 1.20.1 in a way it did not on 1.21.1. Iron's Spells rewrote its addon API
# during the 1.20.1 line: builds at 3.4.0.11 and earlier expose a different shape from the one
# every reflective call in this mod targets, and many 1.20.1 packs still ship those older builds.
# Against them the mod loads, indexes nothing, and silently never casts. 3.15.0 is the floor that
# guarantees the API this mod reflects against.
mandatory = false
# NO version floor here, deliberately, despite the API note above.
#
# "mandatory = false" does NOT mean "ignore the range if the version is wrong" on Forge 1.20.1.
# ModSorter.verifyDependencyVersions() compiles to
#     (mv.isMandatory() || modVersions.containsKey(mv.getModId())) && modVersionNotContained(...)
# so optional exempts an ABSENT mod and nothing else. Iron's Spells installed but BELOW the floor
# is a hard failure: EarlyLoadingException("failure to validate mod list"), mod loading aborts,
# and because it happens before the crash reporter exists the player gets no crash report at all —
# just a dead launch. A floor meant to prevent "loads but never casts" was instead preventing the
# game from starting, which is far worse and is the likely cause of the 1.20.1 load crashes
# reported against 0.10.0 and 0.10.1 by users who had tried older Iron's Spells builds.
#
# The 1.21.1 build never had this because its range is the loose "[1.21,)".
#
# The API floor is real, so it is enforced at runtime instead, where "too old" degrades to a log
# line and no voice casting rather than a broken installation.
versionRange = "[1.20.1,)"
ordering = "AFTER"
side = "BOTH"
