<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; }
body { background:#0a0714; font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
       -webkit-font-smoothing:antialiased; position:relative; }
body::before { content:""; position:absolute; inset:0;
  background:
    radial-gradient(900px 620px at 46% 34%, rgba(90,68,150,.30), rgba(90,68,150,0) 70%),
    radial-gradient(700px 520px at 84% 50%, rgba(120,90,190,.16), rgba(120,90,190,0) 70%); }
.wrap { position:relative; width:1920px; height:1080px; }
h1 { position:absolute; left:160px; top:108px; font-size:88px; font-weight:700;
     color:#ede9fe; letter-spacing:-1px; }
ul { position:absolute; left:172px; top:272px; list-style:none; }
li { display:flex; align-items:center; height:110px; }
.dot { width:19px; height:19px; border-radius:50%; background:#c4a3f0; flex:0 0 19px; }
.txt { margin-left:32px; font-size:45px; color:#e6e5ef; letter-spacing:.2px; }
svg { position:absolute; left:1470px; top:340px; }
</style>
<div class="wrap">
  <h1>Features</h1>
  <ul>
    <li><span class="dot"></span><span class="txt">No voice-chat mod needed</span></li>
    <li><span class="dot"></span><span class="txt">Speak any spell you have equipped</span></li>
    <li><span class="dot"></span><span class="txt">Grammar narrows to what you can cast</span></li>
    <li><span class="dot"></span><span class="txt">Imbued swords &amp; staves supported</span></li>
    <li><span class="dot"></span><span class="txt">HUD chip, themes &amp; base palettes</span></li>
    <li><span class="dot"></span><span class="txt">Aliases, loadouts &amp; voice commands</span></li>
  </ul>

        <stop offset="0%"   stop-color="#d8b4fe" stop-opacity=".55"/>

      </radialGradient>
    </defs>
    <circle cx="110" cy="200" r="95" fill="url(#g)"/>

      <path d="M146.6 131.1 A78 78 0 0 1 146.6 268.9"  stroke="#c9a7f5" stroke-width="21"/>

    <circle cx="110" cy="200" r="34" fill="#d5b8f7" stroke="#ffffff" stroke-width="5"/>
  </svg>
</div>
